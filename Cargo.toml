[package]
name = "martin"
version = "0.4.0"
edition = "2024"
description = "Martin — a deFEEST demoscene engine (music-synced Gaussian-splat shows)"
# `cargo run` → the engine; the procedural-splat generator is the secondary `splatgen` bin
# (`cargo run --bin splatgen`). Without this, two bins make a bare `cargo run` ambiguous.
default-run = "martin"

[dependencies]
# `wav` enables rodio's WAV decoder — the live synth playback feeds bevy_audio a hand-rolled WAV,
# and Bevy's default audio features are vorbis-only (without this, playback panics UnrecognizedFormat).
bevy = { version = "0.19", features = ["wav"] }
# Select features explicitly (mirrors the crate's defaults). The **SH degree** is NOT pinned here —
# it's a one-hot crate feature selected via martin's own `sh0`/`sh3` features (see [features] below),
# so you can build either profile. Needs nightly (nightly_generic_alias); io_ply + planar load our .ply.
bevy_gaussian_splatting = { version = "8.0.0", default-features = false, features = [
    "io_flexbuffers", "io_ply", "planar", "buffer_storage",
    "query_select", "morph_interpolate", "nightly_generic_alias",
    "sort_bitonic", "sort_radix", "sort_rayon", "sort_std",
    "file_asset",
    # dropped: tooling/viewer (the splat crate's own CLI + viewer app — martin uses neither) and
    # web_asset (martin loads local files only) — removes ~19 crates incl. a whole TLS stack.
] }
# Glyph rasterization for splat-text (pure Rust; already in the lockfile transitively).
ab_glyph = "0.2"
# Low-level glyph outlines for pen-write: lets us walk a single-stroke font's contours
# WITHOUT auto-closing them (ab_glyph closes contours, which boxes open strokes). Same
# version ab_glyph already pulls in, so no extra compile.
ttf-parser = "0.25"
# Decode PNG logos into gaussians (logo → splat) + mesh diffuse textures (PNG/JPEG) sampled at the
# UV. Same version Bevy already pulls in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Rasterize SVGs into gaussians (svg: source) — pure Rust (usvg + tiny-skia, no C deps → clean
# cross-compiles), so any vector logo/art is just another morph source, like a PNG.
resvg = { version = "0.47", default-features = false }
# Parse 3DGS `cameras.json` capture poses (MARTIN_CAMERAS). Same version Bevy already pulls in.
serde_json = "1"
# Data-parallel the build-time morph pairing (match_reorder chunks). Already in the lockfile
# transitively (the splat crate's sort_rayon); a direct dep so morph.rs can use it.
rayon = "1"
# CLI front: `martin <show> [--record/--shot/--validate/--serve/…]` compiles flags into the same
# MARTIN_* env the .show + bundle expand into, with OVERWRITE so a flag beats env + the .show file.
clap = { version = "4", features = ["derive"] }
# Base64-encode screenshots for the MCP server's inline image replies (MARTIN_MCP). Already in-tree.
base64 = "0.22"
# Load meshes (COLLADA .dae, .obj, .stl, .ply) → triangles, to sample into gaussians (mesh: source).
mesh-loader = "0.1"
# glTF (.glb/.gltf) loading for `mesh:` — mesh-loader doesn't do glTF, so a separate path samples it.
gltf = { version = "1.4", default-features = false, features = ["import", "utils"] }
# Synth DSP — proper filtered/enveloped voices for the placeholder track. default-features=false
# drops the `files` feature (symphonia/hound); we render to our own hand-rolled WAV.
fundsp = { version = "0.23.0", default-features = false, features = ["std"] }
# Decompress the embedded asset archive in a `--features bundle` single-binary build. Pure Rust
# (no C toolchain → clean cross-compiles), only pulled in for bundled builds.
lz4_flex = { version = "0.13", default-features = false, features = ["std"], optional = true }

[features]
default = ["sh0"]

# Build-time window default: with `--features fullscreen` a live run starts BORDERLESS-FULLSCREEN
# unless told otherwise — the right default for a shipped demo/kiosk binary. Off by default (windowed).
# `--windowed` / `MARTIN_FULLSCREEN=0` / `[settings] fullscreen = false` override it at runtime; F11/F
# toggle live. (A per-production alternative without this feature: bake `fullscreen = true` into the
# show's `[settings]`.)
fullscreen = []

# SH degree is a one-hot compile-time choice in the splat crate, so it can't be a runtime switch.
# `sh0` (default) = one flat colour per splat: lean + fast, ideal for our synthetic text/morph demo.
# `sh3` = full degree-3 view-dependent colour (specular glint), worth it for REAL captures (camping
# footage → Brush). Synthetic content is unaffected either way (its higher-SH coeffs are zero).
# Because the two are mutually exclusive, build sh3 with --no-default-features (see .cargo/config.toml
# aliases `cargo b-sh3` / `cargo r-sh3`, which target a separate dir so both binaries coexist):
#   sh0:  cargo build --release
#   sh3:  cargo build --release --no-default-features --features sh3
sh0 = ["bevy_gaussian_splatting/sh0"]
sh3 = ["bevy_gaussian_splatting/sh3"]

# `cargo build --release --features bundle` IS the bundling pipeline: build.rs reads bundle.toml,
# auto-collects the .ply/PNG the show references, compresses them into the binary; at startup the
# binary self-extracts to a temp dir and plays the baked-in show (no asset files, no env needed).
bundle = ["dep:lz4_flex"]

# Compress the assets at build time for a bundled build (pure Rust; only used when `bundle` is on).
[build-dependencies]
lz4_flex = { version = "0.13", default-features = false, features = ["std"] }

# Faster iteration: optimize deps hard, our crate lightly.
[profile.dev]
opt-level = 1
debug = "line-tables-only" # keep usable backtraces but shrink the dev binary (was ~1.7 GiB)
[profile.dev.package."*"]
opt-level = 3

# Lean, shippable binary: no debuginfo, thin LTO, single codegen unit, stripped.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Fast ITERATION profile: same opt-level=3 (renders are visually identical) but no LTO + parallel
# codegen → the per-source-edit relink drops ~6× (≈2m → ≈18s). Output goes to target/fast/. Use the
# `cargo b-fast` / `r-fast` aliases. Release/LTO stays the shipped + CI build (smaller, slightly faster).
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false

# Fork of the splat renderer so we can inject the explosion displacement into its WGSL
# (shaders load via hardcoded-UUID internal assets — no app-side hook). Tracked as the
# `martin` branch of annejan/bevy_gaussian_splatting (= upstream 8.0.0 + our §1–8 edits,
# documented in that branch's CHANGES.md); Cargo.lock pins the exact commit. To hack the
# shaders locally, point this at a checkout instead: `path = "../bgs-fork"`.
[patch.crates-io]
# Pinned to an immutable REV (not just the branch) so a force-push/rebase of the fork — or a routine
# `cargo update` — can't silently repoint the engine's renderer to unreviewed commits before a deadline.
# To pull new shader edits: push the fork branch, then bump this rev deliberately (+ `cargo update -p …`).
bevy_gaussian_splatting = { git = "https://github.com/annejan/bevy_gaussian_splatting", rev = "e4787a88fd923d53b3f90666c236dd9d7700d04a" }
