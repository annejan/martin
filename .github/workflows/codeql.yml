# Advanced CodeQL — full control over the analysis so this engine stays clean as it's reused across
# future demos. Replaces GitHub's *default* CodeQL setup (which must be turned OFF in
# Settings → Code security → Code scanning, else the two analyses conflict). Over the default it adds:
#   • the broader `security-and-quality` query suite (security + maintainability)
#   • the real build environment for Rust (system headers + nightly + cache + a `cargo fetch` of the
#     dep sources) so CodeQL resolves as many call targets / types as it can (the default setup's bare
#     extraction scored low — it couldn't see the dependency crates)
#   • a documented false-positive filter (the procedural-PRNG "salt" heuristic — see codeql-config.yml)
#   • a weekly schedule, so new advisories surface even on idle weeks
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF results
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Give the Rust extractor the same headers a real build needs (udev/alsa/wayland/xkbcommon),
      # so it can resolve the crate + its deps instead of bailing on missing system libraries.
      - name: Install Linux deps
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libasound2-dev libwayland-dev libxkbcommon-dev

      - name: Install nightly Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly

      - name: Cache cargo
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Fetch the dependency SOURCES so the Rust extractor can resolve calls/types INTO them (Bevy,
      # wgpu, fundsp, the splatting fork, …). Without the deps present the no-build extractor
      # can't see them, and the "calls with a known target" quality metric drops under CodeQL's
      # threshold (the "problems identifying dependencies" warning). build-mode stays `none`.
      - name: Fetch Rust dependencies
        if: matrix.language == 'rust'
        run: cargo fetch --locked

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none # rust/python/actions all use the no-build extractor
          config-file: ./.github/codeql/codeql-config.yml

      # Rust-extractor tuning (CODEQL_EXTRACTOR_RUST_OPTION_* env; ignored by the python/actions
      # legs — the rust extractor only runs on the rust one). Verified against the extractor's
      # config source (github/codeql rust/codeql-extractor.yml + rust/extractor/src/config.rs):
      #   • cargo_features: the extractor DEFAULTS TO ALL FEATURES, which for martin selects
      #     sh0+sh3 (one-hot, mutually exclusive — sh3 wins) AND `bundle` (whose build.rs runs the
      #     whole asset-bundling pipeline inside the extractor's cargo check). "default" analyzes
      #     the configuration we actually ship (sh0, no bundle).
      #   • cargo_target_dir: by default the extractor's internal cargo check (build scripts +
      #     proc-macro compilation — the input to macro expansion) uses a fresh scratch dir every
      #     run; pointing it at the workspace target dir puts it under the rust-cache step above.
      #   • cargo_all_targets: also load test/bench targets — the unit tests are inline
      #     #[cfg(test)] modules (cfg(test) is force-extracted), this completes their dev-dep graph.
      # The pinned nightly (rust-toolchain.toml) is respected as-is: the extractor discovers the
      # sysroot through the rustup shims, and its proc-macro server comes from that toolchain.
      - name: Perform CodeQL Analysis
        env:
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_FEATURES: default
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_ALL_TARGETS: "true"
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: "/language:${{ matrix.language }}"
